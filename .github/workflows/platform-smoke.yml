name: Platform smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to verify; choose all before a release
        type: choice
        default: linux-amd64
        options:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - all

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.platform == 'all' && '["linux-amd64","linux-arm64","darwin-amd64","darwin-arm64"]' || format('["{0}"]', inputs.platform)) }}
    name: Native ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm","darwin-amd64":"macos-15-intel","darwin-arm64":"macos-15"}')[matrix.target] }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
      - name: Build without CGO
        env:
          CGO_ENABLED: "0"
        run: |
          make build VERSION=0.0.0-candidate
          mkdir -p .artifacts/platform-smoke
          target='${{ matrix.target }}'
          python3 scripts/verify-release-binary.py --binary dist/meldra --goos "${target%-*}" --goarch "${target#*-}" --output .artifacts/platform-smoke/build-info.json
      - name: Verify executable and private task store
        run: |
          test "$(dist/meldra version)" = "0.0.0-candidate"
          go test ./internal/task ./internal/store -count=1 -timeout=5m 2>&1 | tee .artifacts/platform-smoke/store.log
      - name: Verify process shutdown and task recovery
        run: |
          pattern='^TestTask(Signals|SignalStops|TerminalClose|PromptEOF|RecoveryHardKill|ResumeUsesRealTerminalTUI)'
          tests="$(go test ./internal/app -list "$pattern")"
          printf '%s\n' "$tests" | grep -q '^TestTask'
          go test ./internal/app -run "$pattern" -count=1 -timeout=5m 2>&1 | tee .artifacts/platform-smoke/recovery.log
      - name: Verify foreground capability flows
        run: python3 scripts/capability-e2e.py --binary dist/meldra --output .artifacts/platform-smoke/capability --only plan-denials --only workspace-edit-policy
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-${{ matrix.target }}
          path: .artifacts/platform-smoke
          include-hidden-files: true
          if-no-files-found: warn

name: Platform smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to verify; choose all before a release
        type: choice
        default: linux-amd64
        options:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - all

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.platform == 'all' && '["linux-amd64","linux-arm64","darwin-amd64","darwin-arm64"]' || format('["{0}"]', inputs.platform)) }}
    name: Native ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm","darwin-amd64":"macos-15-intel","darwin-arm64":"macos-15"}')[matrix.target] }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Build without CGO
        env:
          CGO_ENABLED: "0"
        run: make build VERSION=0.2.0-candidate
      - name: Verify executable and private task store
        run: |
          test "$(dist/meldra version)" = "0.2.0-candidate"
          go test ./internal/task ./internal/store -count=1 -timeout=5m
      - name: Verify process shutdown and task recovery
        run: |
          pattern='^TestTask(Signals|SignalStops|TerminalClose|PromptEOF|RecoveryHardKill|ResumeUsesRealTerminalTUI)'
          tests="$(go test ./internal/app -list "$pattern")"
          printf '%s\n' "$tests" | grep -q '^TestTask'
          go test ./internal/app -run "$pattern" -count=1 -timeout=5m

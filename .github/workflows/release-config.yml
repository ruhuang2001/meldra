name: Release configuration

on:
  push:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-config.yml
  pull_request:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-config.yml

concurrency:
  group: release-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.14.0"
          args: check

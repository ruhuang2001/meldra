name: Release configuration

on:
  push:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-config.yml
      - .github/workflows/release-prerelease.yml
      - .github/workflows/release-please.yml
      - release-please-config.json
      - .release-please-manifest.json
      - scripts/release.py
      - scripts/test_release.py
  pull_request:
    branches: [main]
    paths:
      - .goreleaser.yaml
      - .github/workflows/release-config.yml
      - .github/workflows/release-prerelease.yml
      - .github/workflows/release-please.yml
      - release-please-config.json
      - .release-please-manifest.json
      - scripts/release.py
      - scripts/test_release.py

concurrency:
  group: release-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/release-*.yml
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.14.0"
          args: check
      - name: Test release version progression and artifact validation
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

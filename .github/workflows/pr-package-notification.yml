name: Report PR package status

on:
  workflow_run:
    workflows: ["Build PR test artifacts"]
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Report package status
        uses: actions/github-script@v8
        with:
          script: |
            const { action, workflow_run: run } = context.payload;
            core.info(`source event=${run.event}, title=${run.display_title}, action=${action}`);
            if (action !== 'completed') {
              core.notice(`ignoring workflow_run action: ${action}`);
              return;
            }
            if (run.conclusion === 'cancelled') {
              core.notice('source package run was cancelled');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const marker = data.artifacts.find(({ name }) => name.startsWith('pr-package-request-'));
            if (!marker) {
              core.notice('source run has no PR package request marker');
              return;
            }
            const match = /^pr-package-request-(\d+)-/.exec(marker.name);
            if (!match) {
              core.setFailed(`unexpected marker name: ${marker.name}`);
              return;
            }

            const issueNumber = Number(match[1]);
            const archive = data.artifacts.find(({ name }) => name.startsWith(`meldra-pr-${issueNumber}-`));
            const downloadURL = archive && `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${archive.id}`;
            const body = run.conclusion === 'success' && archive
              ? `✅ Test archives ready: **${archive.name}**\n\n[Download test archive](${downloadURL}) · Expires in 7 days.`
              : `❌ Test archive packaging failed. [View workflow logs](${run.html_url})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

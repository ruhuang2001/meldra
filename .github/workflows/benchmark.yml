name: Runtime benchmarks

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Samples per microbenchmark
        type: choice
        default: "5"
        options: ["3", "5", "10"]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Validate report tooling
        run: make benchmark-report-test
      - name: Measure runtime and allocations
        env:
          BENCH_COUNT: ${{ inputs.repetitions }}
        run: make benchmark-report
      - name: Evaluate offline workflows
        run: make benchmark-eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmarks/results/
          if-no-files-found: warn
          retention-days: 14

name: Meldra Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag whose artifacts should be repaired
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Events created with GITHUB_TOKEN do not start another workflow. The
      # dispatch path repairs a release that was created but whose asset upload
      # did not complete.
      - name: Select release tag
        id: release-tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || steps.release.outputs.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "tag_name must be a semantic-version tag beginning with v" >&2
            exit 1
          fi
          printf 'tag_name=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release target
        id: release-target
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-tag.outputs.tag_name }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          printf 'commit_sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release-tag.outputs.tag_name }}
          persist-credentials: false

      - name: Verify checked-out tag
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        env:
          COMMIT_SHA: ${{ steps.release-target.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - uses: actions/setup-go@v6
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        with:
          go-version: "1.26.5"

      - uses: goreleaser/goreleaser-action@v6
        if: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
        with:
          distribution: goreleaser
          version: "v2.14.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

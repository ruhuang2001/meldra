version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: meldra
    main: .
    binary: meldra
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ title .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: asc

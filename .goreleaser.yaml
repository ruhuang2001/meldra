version: 2

before:
  hooks:
    - make check

builds:
  - id: meldra
    main: .
    binary: meldra
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ title .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  # Release Please owns the release notes; GoReleaser only adds artifacts.
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^refactor"

# SanityHarness configuration for evaluating Meldra.
# Run with: make benchmark-sanity
#
# This file defines Meldra as a custom agent and points the harness at the
# task cache/output directories under this repository.

[harness]
session_dir = "benchmarks/sanityharness/sessions"
default_timeout = 300
max_attempts = 1
output_format = "all"

[docker]
auto_pull = true

[agents.meldra]
command = "meldra"
args = ["--yes", "--prompt", "{prompt}"]
# Each task gets ephemeral configuration and session storage. Authentication is
# supplied through the inherited OPENAI_API_KEY instead of mounting ~/.meldra.
env = { MELDRA_HOME = "/tmp/meldra" }

[sandbox]
# Keep host configuration and cache directories out of the benchmark sandbox.
# The Meldra executable is made available by the Makefile and its task-local
# configuration is stored under the sandbox's tmpfs /tmp directory.
shared_readwrite_dirs = []
shared_readonly_dirs = []
# Prevent the agent from reading other benchmark tasks or previous results.
readable_denylist = ["benchmarks/sanityharness/sessions", "benchmarks/swe-bench"]
